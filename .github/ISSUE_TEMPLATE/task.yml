name: 작업
description: Bro-exile의 새 기획, 구현, 에셋, 검증, 출시 작업을 등록합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issue는 작업의 상태, 논의, 담당자, 의존성, PR을 관리합니다.
        상세 실행 명세와 에이전트 handoff가 필요하면 이슈 생성 뒤 `todos/` 문서를 연결합니다.
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 플레이어 또는 프로젝트에 어떤 변화가 생겨야 하는지 적습니다.
      placeholder: 무엇을 만들고, 무엇을 검증할지 한두 문단으로 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - p1 - 핵심 경로
        - p2 - 중요하지만 보류 가능
        - p3 - 나중에 진행
    validations:
      required: true
  - type: dropdown
    id: owner_lane
    attributes:
      label: 첫 owner lane
      options:
        - producer
        - planning
        - dev
        - asset
        - validation
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: 마일스톤 / delivery
      placeholder: "예: M1-D11, Public Demo, backlog"
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: 선행 이슈
      description: 선행 작업이 있으면 GitHub 이슈 번호로 적습니다.
      placeholder: "예: #12, #15"
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: Validator가 확인할 수 있는 체크리스트로 적습니다.
      placeholder: |
        - [ ] debug 또는 데이터 검증
        - [ ] smoke 또는 플레이 검증
        - [ ] UI/에셋이면 실제 capture 증거
    validations:
      required: true
  - type: input
    id: local_todo
    attributes:
      label: 연결된 todo
      description: 기존 todo가 있으면 저장소 상대 경로를 적습니다. 새 작업이면 이슈 생성 뒤 추가할 수 있습니다.
      placeholder: todos/NNN-status-priority-slug.md
  - type: checkboxes
    id: gates
    attributes:
      label: 운영 확인
      options:
        - label: 우선순위 또는 제품 방향 변경은 Product Owner 승인 뒤 반영합니다.
          required: true
        - label: UI, 에셋, 애니메이션 작업은 pixel-perfect 검증과 실제 capture 경로를 남깁니다.
          required: false
